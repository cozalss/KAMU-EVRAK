<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="kamu-evrak">
  <!-- warm-light tema: terracotta-gold üzerinde evrak + terazi (kamu/adalet) -->
  <rect width="64" height="64" rx="14" fill="#b07a1e"/>
  <!-- evrak sayfası -->
  <path d="M19 12h18l9 9v25a3 3 0 0 1-3 3H19a3 3 0 0 1-3-3V15a3 3 0 0 1 3-3z" fill="#fffdf9"/>
  <path d="M37 12v8a1 1 0 0 0 1 1h8z" fill="#f3e6cb"/>
  <!-- terazi: direk + kefe çubuğu + iki kefe (ç,ş,ğ yok — saf vektör) -->
  <g stroke="#8a5e12" stroke-width="2.2" stroke-linecap="round" fill="none">
    <line x1="32" y1="28" x2="32" y2="44"/>
    <line x1="23" y1="31" x2="41" y2="31"/>
    <path d="M23 31l-4 7h8z"/>
    <path d="M41 31l-4 7h8z"/>
  </g>
  <circle cx="32" cy="27" r="2.4" fill="#8a5e12"/>
</svg>
