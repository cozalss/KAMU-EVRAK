<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400..600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>ÖLÇÜM — taslak jank</title>
    <script>
      /* ?cubuk=15 → KLASİK (yer kaplayan) kaydırma çubuğu. Headless shell varsayılanı
         overlay'dir (0px) ve o hâlde ölçek↔çubuk geri besleme kenarı hiç oluşmaz; ölçüm
         yanlışlıkla "temiz" der. Kullanıcı Windows 11 + Chrome kullanıyor, orada çubuk
         yer kaplar — ::-webkit-scrollbar stillenince Chrome tam o yerleşime döner. */
      (function () {
        const g = Number(new URLSearchParams(location.search).get("cubuk") || 0);
        if (!g) return;
        const s = document.createElement("style");
        s.textContent = `*::-webkit-scrollbar{width:${g}px;height:${g}px}`
          + `*::-webkit-scrollbar-thumb{background:#888;border-radius:8px}`
          + `*::-webkit-scrollbar-track{background:#eee}`;
        document.head.appendChild(s);
      })();
    </script>
    <script>
      window.__ORNEKLER = [];
      window.__HATA = [];
      addEventListener("error", (e) => window.__HATA.push(String(e.message).split("\n")[0]));
      (function ornekle() {
        const yigin = document.querySelector(".ke-a4-yigin");
        const olcek = document.querySelector(".ke-a4-olcek");
        const kagit = document.querySelector("[data-karar-kagit]");
        if (yigin) {
          const yb = yigin.getBoundingClientRect();
          const st = getComputedStyle(yigin);
          const m = olcek ? new DOMMatrixReadOnly(getComputedStyle(olcek).transform) : null;
          window.__ORNEKLER.push({
            t: Math.round(performance.now()),
            kare: window.__ORNEKLER.length,
            yiginYuk: Math.round(yb.height),
            olcek: m ? Number(m.a.toFixed(4)) : null,
            gecis: st.transitionProperty + " " + st.transitionDuration,
            sutunlar: kagit && kagit.parentElement ? getComputedStyle(kagit.parentElement).gridTemplateColumns : null,
            // Kaydırma çubuğu geri besleme kenarının doğrudan kanıtı:
            kapGen: kagit ? kagit.clientWidth : null,
            kapDisGen: kagit ? kagit.offsetWidth : null,
            cubuk: kagit ? kagit.offsetWidth - kagit.clientWidth : null,
          });
        }
        requestAnimationFrame(ornekle);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/olcum-jank.jsx"></script>
  </body>
</html>
