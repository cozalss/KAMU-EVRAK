<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="kamu-evrak">
  <!-- Kurumsal Devlet teması: lacivert üzerinde resmî evrak + onay mührü (saf vektör) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15375f"/>
      <stop offset="1" stop-color="#0f2a4a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- evrak sayfası + kıvrık köşe -->
  <path d="M20 13h16l10 10v25a3 3 0 0 1-3 3H20a3 3 0 0 1-3-3V16a3 3 0 0 1 3-3z" fill="#ffffff"/>
  <path d="M36 13v9a1 1 0 0 0 1 1h9z" fill="#cdddf2"/>
  <!-- satırlar + onay işareti (mavi) -->
  <g stroke="#1d4ed8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="24" y1="29" x2="36" y2="29"/>
    <line x1="24" y1="35" x2="33" y2="35"/>
    <path d="M24 42l4 4 9-9"/>
  </g>
</svg>
