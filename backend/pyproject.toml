[project]
name = "kamu-evrak-backend"
version = "0.1.0"
description = "Kamu Evrak ve Yazışma Süreçleri için Akıllı Agent Destek Sistemi — FastAPI + LangGraph (TEKNOFEST 2026, 1. Senaryo)"
requires-python = ">=3.11"
# LİSANS NOTU: AGPL bağımlılık YOK. ADALET'teki PyMuPDF (AGPL) → pypdfium2 (Apache/BSD)
# ile değiştirildi (MIT açık-kaynak repo + TAKP GitHub zorunluluğu — şartname §7).
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "httpx>=0.27.2",
    "python-multipart>=0.0.31",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.1",
    # Ajan orkestrasyonu
    "langgraph>=0.2.40",
    "langchain-core>=0.3.10",
    # Multimodal — OCR (sistem-kurulumsuz, offline) + PDF (AGPL'siz) + Word
    "rapidocr-onnxruntime>=1.4.0",
    "pypdfium2>=4.30.0",
    "python-docx>=1.2.0",
    "pillow>=10.4.0",
    "numpy>=1.26.0",
    # Resmî yazı taslak render (jinja2 + PDF/DOCX)
    "jinja2>=3.1.4",
    "reportlab>=4.2.0",
]

[project.optional-dependencies]
# Mevzuat RAG motoru (ADALET retrieval/ KEEP) — ağır; iskelet için gerekli DEĞİL.
# GPU için torch CUDA wheel'ı ayrıca kurulur (docs/07-model-lisanslari.md).
rag = [
    "qdrant-client>=1.12.0",
    "redis>=5.1.1",
    "FlagEmbedding>=1.3.2",
    "sentence-transformers>=3.2.0",
    "transformers>=4.45.0",
    "torch>=2.6.0",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.10.0",
]
# Tam Türkçe diakritik için Tesseract 5 (binary gerekir; RapidOCR offline varsayılan).
ocr-tesseract = ["pytesseract>=0.3.13"]
# Lokal LLM (Qwen GGUF) — opsiyonel; OpenAI bulut httpx ile zaten core.
llm = ["llama-cpp-python>=0.3.0"]
# Sentetik veri üretimi (scripts/gen_synthetic.py) + test/lint.
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "faker>=30.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "api", "core", "eval", "multimodal", "retrieval", "yazi"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
